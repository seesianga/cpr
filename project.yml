name: LifesaverVision

options:
  deploymentTarget:
    visionOS: "26.0"
  generateEmptyDirectories: true

configs:
  Debug-Beta: debug
  Release-Stable: release
  UITest: debug
  Demo: debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Device builds need a signing team; the simulator ignores both of these.
    DEVELOPMENT_TEAM: AAG5WTMX8G
    CODE_SIGN_STYLE: Automatic

packages:
  RealityKitContent:
    path: Packages/RealityKitContent

targets:
  LifesaverVision:
    type: application
    platform: visionOS
    deploymentTarget: "26.0"
    preBuildScripts:
      - name: Validate loose RealityKit delivery assets
        script: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 "$SRCROOT/Scripts/validate_assets.py"
        basedOnDependencyAnalysis: false
    sources:
      - path: App
        excludes:
          - PrivacyInfo.xcprivacy
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Core
      - path: Features
      - path: Spatial
      - path: Audio/AudioDirector.swift
      - path: Audio/AudioPreferences.swift
      - path: Audio/CompressionCountAnnouncer.swift
      - path: Audio/CaptionSupport.swift
      - path: Audio/SpatialAudioManager.swift
      - path: Audio/ELEVENLABS_AUDIO_MANIFEST.json
        buildPhase: resources
      - path: Audio/Delivery
        buildPhase: resources
      - path: Resources/Captions
        excludes:
          - .gitkeep
        buildPhase: resources
      - path: Resources/Courses
        buildPhase: resources
      - path: Resources/Questions
        buildPhase: resources
      - path: Resources/Configuration
        buildPhase: resources
      - path: Media/3D/USDZ
        type: group
        buildPhase:
          copyFiles:
            destination: resources
            subpath: USDZ
      - path: Media/3D/Reality
        type: group
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Reality
      - path: Docs/CLINICAL_FACTS_EXTRACT.json
        buildPhase: resources
    dependencies:
      - package: RealityKitContent
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: App/LifesaverVision.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.lifesaver.vision
        PRODUCT_NAME: LifesaverVision
      # PERSONAL_TEAM hides Sign in with Apple, which the free signing team cannot be
      # issued a profile for. Drop it from all four configs once the paid programme
      # enrolment lands, alongside restoring the entitlement key.
      configs:
        Debug-Beta:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG BETA PERSONAL_TEAM
        Release-Stable:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STABLE PERSONAL_TEAM
        UITest:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG UITEST PERSONAL_TEAM
        Demo:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEMO PERSONAL_TEAM
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lifesaver Vision
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHandsTrackingUsageDescription: Optional practice uses hand position and motion to guide placement and rhythm. Hand data is processed on device and is not stored.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UISceneConfigurations:
            UISceneSessionRoleImmersiveSpaceApplication:
              - UISceneInitialImmersionStyle: UIImmersionStyleMixed

  LifesaverVisionTests:
    type: bundle.unit-test
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
    dependencies:
      - target: LifesaverVision
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lifesaver.vision.tests

  LifesaverVisionUITests:
    type: bundle.ui-testing
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    dependencies:
      - target: LifesaverVision
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lifesaver.vision.uitests
        TEST_TARGET_NAME: LifesaverVision

schemes:
  LifesaverVision:
    build:
      targets:
        LifesaverVision: all
        LifesaverVisionTests:
          - test
        LifesaverVisionUITests:
          - test
    run:
      config: Debug-Beta
    test:
      config: UITest
      gatherCoverageData: true
      targets:
        - name: LifesaverVisionTests
        - name: LifesaverVisionUITests
    profile:
      config: Release-Stable
    analyze:
      config: Debug-Beta
    archive:
      config: Release-Stable
